# Checks every change: lint, types, unit tests, then the production build tested in real
# browsers (desktop and phone Chromium, and WebKit for iPhone-like coverage).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=critical

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PW_HEADLESS: 'true'
      E2E_PRODUCTION: '1'
      PW_WEBKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Keeps the hooks the tests use in the build; the shipped build is made without it.
      - run: VITE_E2E=1 npm run build
      - run: npx playwright test --grep-invert online.spec.ts
      # Multiplayer already runs several software-rendered globes in one test.
      - run: npx playwright test e2e/online.spec.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
