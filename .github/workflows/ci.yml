# Checks every change: lint, types, unit tests, then the production build tested in real
# browsers (desktop and phone Chromium, and WebKit for iPhone-like coverage).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm test
      - run: npm audit --omit=dev

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PW_HEADLESS: 'true'
      E2E_PRODUCTION: '1'
      PW_WEBKIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Keeps the hooks the tests use in the build; the shipped build is made without it.
      - run: VITE_E2E=1 npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
