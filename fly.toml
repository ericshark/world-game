# Fly.io settings for World Game (step-by-step guide: docs/deploy-fly.md).
# Run exactly one machine: rooms and the Quick Duel queue live in its memory, and the SQLite
# database lives on its volume. Never scale this above one.

# Change both before the first deploy: the app name must be unique on Fly.
app = 'world-game-change-me'
primary_region = 'iad'

[build.args]
  # Shown on the privacy page so people can ask about their data. Built into the site.
  VITE_PRIVACY_CONTACT = 'ericzwierzynski1@gmail.com'

[env]
  NODE_ENV = 'production'
  PORT = '8788'
  DATABASE_PATH = '/data/world-game.sqlite'
  # The address players use. Start with https://<app>.fly.dev, then your own domain.
  PUBLIC_ORIGIN = 'https://world-game-change-me.fly.dev'
  # Fly's proxy appends to X-Forwarded-For, so the player's address is read from Fly-Client-IP.
  TRUST_PROXY = '1'
  CLIENT_IP_HEADER = 'fly-client-ip'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8788
  force_https = true
  # Stopping the machine would end every room and empty the queue.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Every player holds a WebSocket open; Fly's default limit (25 connections) would turn players
  # away. The load test ran 300 players at a fifth of one core.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
