services:
  - type: web
    name: world-game
    runtime: docker
    region: virginia
    plan: free
    branch: main
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: DAILY_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
