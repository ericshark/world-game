services:
  - type: web
    name: world-game
    runtime: docker
    region: virginia
    plan: starter
    branch: main
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    disk:
      name: world-game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DAILY_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
