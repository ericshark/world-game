services:
  - type: web
    name: world-game
    runtime: docker
    region: virginia
    plan: free
    branch: main
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: DAILY_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Backups (docs/deployment.md). Set all four in Render's dashboard; while the URL is empty
      # the server runs without them and its data does not survive a restart.
      - key: LITESTREAM_REPLICA_URL
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
